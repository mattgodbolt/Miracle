name: CI

# push covers same-repo branches (a PR here opens moments after the push);
# pull_request exists for forks, so the job guard skips same-repo PR events
# to avoid running everything twice.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run FUSE Z80 tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-web
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Unpack existing ROMs
        run: |
          cd public
          curl -fsSL https://miracle.xania.org/miracle-roms.tar.gz | tar zx
      - name: Build distribution
        run: |
          npm ci
          npm run build
      # Test runs finish out of order, so an older commit can reach the deploy after a newer one.
      - name: Check this is still the newest commit on main
        id: newest
        run: |
          tip=$(git ls-remote --exit-code origin refs/heads/main)
          tip=${tip%%[[:space:]]*}
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying: main has moved on to $tip, whose own run deploys it if its tests pass"
          fi
      - name: Deploy to S3
        if: steps.newest.outputs.deploy == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-2
        run: |
          # Names under assets/ contain a content hash. Upload before the html that names them.
          aws s3 sync dist/assets s3://miracle.xania.org/assets \
            --no-progress \
            --cache-control "max-age=31536000,immutable" --metadata-directive REPLACE
          aws s3 sync dist s3://miracle.xania.org \
            --no-progress --exclude "assets/*" \
            --cache-control max-age=30 --metadata-directive REPLACE
