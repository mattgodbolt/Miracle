name: CI

# push covers same-repo branches (a PR here opens moments after the push);
# pull_request exists for forks, so the job guard skips same-repo PR events
# to avoid running everything twice.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run FUSE Z80 tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Unpack existing ROMs
        run: |
          cd public
          curl -sL https://miracle.xania.org/miracle-roms.tar.gz | tar zx
      - name: Build distribution
        run: |
          npm ci
          npm run build
          rm -rf .git
      - uses: jakejarvis/s3-sync-action@master
        with:
          args: --cache-control max-age=30 --metadata-directive REPLACE
        env:
          AWS_REGION: us-east-2
          AWS_S3_BUCKET: miracle.xania.org
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SOURCE_DIR: dist
